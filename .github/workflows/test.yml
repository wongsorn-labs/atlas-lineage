name: Test

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test DB (with coverage)
        run: pnpm --filter @wongsorn-labs/atlas-lineage-db test:cov

      - name: Test API (with coverage)
        run: pnpm --filter @wongsorn-labs/atlas-lineage-api test:cov

      - name: Test Web (with coverage)
        run: pnpm --filter @wongsorn-labs/atlas-lineage-web test:cov

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/db/coverage/
            apps/api/coverage/
            apps/web/coverage/
          retention-days: 14

  bump-version:
    name: Bump web patch version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # A later push here re-triggers this workflow; the commit's
          # "[skip ci]" marker (below) is what breaks the loop.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        working-directory: apps/web
        run: |
          npm version patch --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json
          git commit -m "chore(web): bump version to ${NEW_VERSION} [skip ci]"
          git push
